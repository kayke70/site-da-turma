<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Turma Show!</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #ff4081;
      font-size: 36px;
      margin-bottom: 20px;
    }
    .colega {
      background-color: #ffffff;
      border: 3px dashed #ff9800;
      border-radius: 15px;
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.1);
    }
    .nome {
      font-size: 22px;
      color: #3f51b5;
      font-weight: bold;
    }
    .caracteristica {
      margin-top: 10px;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Conheça a Galera!</h1>

  <div class="colega">
    <div class="nome">Kayke</div>
    <div class="caracteristica">Sonha em ser jogador de futebol, mas também quer virar um programador de sucesso!</div>
  </div>

  <div class="colega">
    <div class="nome">Miguel Pereira</div>
    <div class="caracteristica">Quer ser um dentista famoso, inspirado pela mãe que também trabalha com isso!</div>
  </div>

  <div class="colega">
    <div class="nome">Caio</div>
    <div class="caracteristica">Tem o sonho de se tornar um diretor de filmes de sucesso e arrasar nas telonas!</div>
  </div>

</body>
</html>
